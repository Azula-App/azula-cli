[package]
name = "azula"
version = "0.1.0"
edition = "2021"
description = "Server-side companion for the azula p2p app: binds an iroh endpoint and serves an LLM relay and a remote-shell bridge over ALPN protocols."
license = "MIT OR Apache-2.0"

[[bin]]
name = "azula"
path = "src/main.rs"

[dependencies]
iroh = "1"
iroh-tickets = "1"

anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
shell-words = "1"
axum = "0.8"
qrcode = { version = "0.14", default-features = false }
rmcp = { version = "1.8", default-features = false, features = [
    "client",
    "server",
    "macros",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
