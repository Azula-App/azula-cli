[workspace]
members = ["demos"]

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"

[package]
name = "azula"
version = "0.2.0"
edition = "2021"
description = "Command-line companion for the azula p2p app: an MCP server for your phone, remote terminals with CI handoff, agent-drawn UI, and an offline-forwarding relay — all over direct iroh connections."
license = "MIT OR Apache-2.0"
homepage = "https://azula.app"
repository = "https://github.com/Azula-App/azula-cli"
readme = "README.md"
keywords = ["p2p", "iroh", "mcp", "terminal", "cli"]
categories = ["command-line-utilities", "network-programming", "development-tools"]
# Everything that isn't the crate itself. `.agents` is a symlink to the
# untracked `.claude/`, so it DANGLES in any fresh checkout — `cargo package`
# hard-errors on it ("failed to open for archiving"), which would have broken
# the first release in CI. The rest is repo infrastructure (packaging
# manifests, container files, CI) that has no business in a published crate.
exclude = [
    ".agents",
    ".claude",
    ".azula",
    ".github",
    "dist",
    "docker",
    "Dockerfile",
    "docker-compose.yml",
    ".dockerignore",
    "docs",
]

[lints]
workspace = true

[lib]
name = "azula"
path = "src/lib.rs"

[[bin]]
name = "azula"
path = "src/main.rs"

[dependencies]
iroh = "1"
iroh-tickets = "1"
data-encoding = "2"
sha2 = "0.11"

anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
shell-words = "1"
axum = "0.8"
qrcode = { version = "0.14", default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "1.8", default-features = false, features = [
    "client",
    "server",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
gethostname = "1.1.0"
# cli-multi-session-relay phase 3 (`azula terminal attach`'s raw-mode client,
# `azula terminal kill`'s SIGTERM, local PTY sizing): already a transitive
# dep via portable-pty, promoted to direct since we call it ourselves.
libc = "0.2"
