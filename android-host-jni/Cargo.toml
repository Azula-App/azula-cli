[package]
name = "azula-android-host-jni"
version = "0.1.0"
edition = "2021"
description = "libazula_host.so: the attach-mode compute broker behind a small JNI surface, for the azula Android app's AVF host."
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
name = "azula_host"
crate-type = ["cdylib"]

[dependencies]
azula = { path = ".." }
# Already in the tree (via rustls-platform-verifier); 0.22 has a different API.
jni = "0.21"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
