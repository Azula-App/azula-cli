[package]
name = "azula-guest"
version = "0.1.0"
edition = "2021"
description = "Job worker that runs inside the azula remote-compute Linux VM"
publish = false

# Standalone: not part of the root azula workspace.
[workspace]

[lib]
name = "azula_guest"
path = "src/lib.rs"

[[bin]]
name = "azula-guest"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
