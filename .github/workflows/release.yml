# Release pipeline for azula-cli.
#
# Triggered by pushing a `v*` tag (e.g. `v0.2.0`). One tag drives every
# distribution channel:
#
#   1. version-guard     — the tag version MUST match the workspace
#                           Cargo.toml `[package] version` (single source of
#                           truth, per openspec/changes/cli-multi-session-relay
#                           design.md D7). Fails fast otherwise.
#   2. build-and-release  — builds the `azula` binary (root package only —
#                           `demos` is excluded via `-p azula`) for four
#                           targets and attaches tar.gz + sha256 to a GitHub
#                           Release. This Release is the artifact host the
#                           other channels pull from; it is not itself a
#                           user-facing install channel.
#   3. publish-crates    — `cargo publish` to crates.io.
#   4. publish-npm       — generates + publishes the four platform npm
#                           packages plus the `azula-cli` meta package.
#   5. publish-homebrew  — bumps version + sha256 in the `homebrew-azula`
#                           tap repo and pushes.
#
# Jobs 3-5 each `if:`-gate on their secret being present, so a repo that
# hasn't configured a given channel yet still gets a clean GitHub Release
# instead of a hard failure. See dist/README.md for what a maintainer must
# set up manually (secrets, the tap repo, the npm org) before each channel
# goes live.
#
# Cross-compilation note (aarch64-unknown-linux-musl): this is the one
# target in the matrix that isn't natively buildable on its runner (an
# x86_64 ubuntu host can't link a musl/aarch64 binary with just
# `rustup target add`). We use `cross` (https://github.com/cross-rs/cross)
# rather than cargo-zigbuild: it's the more actively maintained,
# purpose-built tool for exactly this "different arch *and* different libc"
# case, its Docker images already ship a matched musl aarch64 toolchain (no
# separate Zig version to track), and GitHub's ubuntu runners have Docker
# preinstalled so there's no extra setup cost. cargo-zigbuild is the lighter
# no-Docker alternative if `cross`'s Docker dependency ever becomes a
# problem in CI.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# Least-privilege default; the one job that needs to write (creating the
# GitHub Release) elevates itself below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-guard:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag to workspace Cargo.toml version
        id: check
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          # The workspace root Cargo.toml carries exactly one [package]
          # table (the `azula` crate itself); [workspace] declares no
          # version of its own, so the first `version = "..."` line in the
          # file is unambiguous. Avoids needing a Rust toolchain just to
          # answer this question.
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"

          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::Could not find a version in Cargo.toml"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag 'v${TAG_VERSION}' does not match Cargo.toml version '${CARGO_VERSION}'. Bump Cargo.toml (and Cargo.lock) and re-tag."
            exit 1
          fi

          echo "Tag version matches Cargo.toml: ${CARGO_VERSION}"
          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build ${{ matrix.target }}
    needs: version-guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          - target: x86_64-apple-darwin
            os: macos-14
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (native x86_64-musl build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (aarch64-musl cross-compile)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p azula

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p azula

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-guard.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="azula-${VERSION}-${TARGET}.tar.gz"

          mkdir -p stage
          cp "target/${TARGET}/release/azula" stage/azula
          chmod +x stage/azula
          tar -C stage -czf "$ARCHIVE" azula

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [version-guard, build-and-release]
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish -p azula
        run: cargo publish -p azula --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish npm packages
    needs: [version-guard, build-and-release]
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download release binaries
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-guard.outputs.version }}"
          TAG="${{ github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            mkdir -p "bin-download/${target}"
            curl -sSfL -o "archive.tar.gz" "${BASE}/azula-${VERSION}-${target}.tar.gz"
            tar -xzf archive.tar.gz -C "bin-download/${target}"
            rm archive.tar.gz
          done

      - name: Generate npm packages
        run: |
          node dist/npm/generate.mjs \
            --version "${{ needs.version-guard.outputs.version }}" \
            --bin-dir bin-download \
            --out-dir npm-out

      - name: Publish platform packages, then the meta package
        run: |
          set -euo pipefail
          # Platform packages first so the meta package's optionalDependencies
          # resolve on npm the moment it's published.
          for pkg in npm-out/cli-*/; do
            npm publish "$pkg" --access public
          done
          npm publish "npm-out/azula-cli/" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-homebrew:
    name: Bump Homebrew tap
    needs: [version-guard, build-and-release]
    if: ${{ secrets.TAP_PUSH_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout azula-cli (formula template)
        uses: actions/checkout@v4
        with:
          path: azula-cli

      - name: Checkout homebrew-azula tap
        uses: actions/checkout@v4
        with:
          repository: Azula-App/homebrew-azula
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: homebrew-azula

      - name: Download sha256 sums from the release
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-guard.outputs.version }}"
          TAG="${{ github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          mkdir -p sums
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            curl -sSfL -o "sums/${target}.sha256" "${BASE}/azula-${VERSION}-${target}.tar.gz.sha256"
          done

      - name: Render Formula/azula.rb from the template
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-guard.outputs.version }}"

          # sha256sum/shasum both write "<hash>  <filename>"; the hash is
          # always the first field.
          SHA_DARWIN_ARM64="$(cut -d' ' -f1 sums/aarch64-apple-darwin.sha256)"
          SHA_DARWIN_X64="$(cut -d' ' -f1 sums/x86_64-apple-darwin.sha256)"
          SHA_LINUX_X64="$(cut -d' ' -f1 sums/x86_64-unknown-linux-musl.sha256)"
          SHA_LINUX_ARM64="$(cut -d' ' -f1 sums/aarch64-unknown-linux-musl.sha256)"

          mkdir -p homebrew-azula/Formula
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_AARCH64_APPLE_DARWIN__/${SHA_DARWIN_ARM64}/" \
            -e "s/__SHA256_X86_64_APPLE_DARWIN__/${SHA_DARWIN_X64}/" \
            -e "s/__SHA256_X86_64_UNKNOWN_LINUX_MUSL__/${SHA_LINUX_X64}/" \
            -e "s/__SHA256_AARCH64_UNKNOWN_LINUX_MUSL__/${SHA_LINUX_ARM64}/" \
            azula-cli/dist/homebrew/azula.rb > homebrew-azula/Formula/azula.rb

      - name: Commit and push
        run: |
          set -euo pipefail
          cd homebrew-azula
          git config user.name "azula-release-bot"
          git config user.email "release@azula.app"
          git add Formula/azula.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to push."
            exit 0
          fi
          git commit -m "azula ${{ needs.version-guard.outputs.version }}"
          git push
